# Fetches Withings + Fitbit (Google Health) data daily, commits it to data/, and
# publishes the dashboard to GitHub Pages. Pushes that change the page or config
# just rebuild the site without fetching.
#
# One-time setup in a new copy: run scripts/setup_auth.py, add a SECRETS_PAT secret
# (fine-grained token, this repo only, "Secrets: read and write") so rotated refresh
# tokens can be saved, and set Settings → Pages → Source to "GitHub Actions".
name: Update dashboard

on:
  schedule:
    - cron: "0 20 * * *"   # UTC; 06:00/07:00 Sydney, after the morning BP session syncs
  workflow_dispatch:
  push:
    branches: [main]
    paths: [site/**, config.yaml, scripts/build_site.py]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch data
        id: fetch
        if: github.event_name != 'push'
        env:
          WITHINGS_CLIENT_ID: ${{ secrets.WITHINGS_CLIENT_ID }}
          WITHINGS_CLIENT_SECRET: ${{ secrets.WITHINGS_CLIENT_SECRET }}
          WITHINGS_REFRESH_TOKEN: ${{ secrets.WITHINGS_REFRESH_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TOKENS_DIR: ${{ runner.temp }}/tokens
        run: python scripts/fetch.py

      # Withings refresh tokens are single-use: save the new one even if the fetch failed
      - name: Save rotated tokens
        if: always() && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          TOKENS_DIR: ${{ runner.temp }}/tokens
        run: |
          shopt -s nullglob
          for f in "$TOKENS_DIR"/*; do
            gh secret set "$(basename "$f")" --repo "$GITHUB_REPOSITORY" < "$f"
            echo "saved $(basename "$f")"
          done

      # Commits as the repo owner's GitHub noreply address, never a personal email
      - name: Commit data
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update health data $(date -u +%Y-%m-%d)"
          git push

      - name: Build site
        if: ${{ !cancelled() }}
        run: python scripts/build_site.py

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: _site

      - uses: actions/deploy-pages@v4
        id: deploy
        if: ${{ !cancelled() }}
